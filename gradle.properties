android.useAndroidX=true
android.enableJetifier=true

# Keep CI within the GitHub runner memory budget; avoid parallel daemon/GC thrash.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1g
