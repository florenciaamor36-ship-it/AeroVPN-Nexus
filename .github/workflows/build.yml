name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source
        run: |
          tar -xzf app_src.tar.gz
          # The source archive contains stale, unavailable Maven coordinates.
          sed -i \
            -e '/com.wireguard.android:tunnel/d' \
            -e '/com.github.2dust:v2rayNG/d' \
            -e 's/minifyEnabled true/minifyEnabled false/' \
            -e 's/shrinkResources true/shrinkResources false/' \
            app/build.gradle
          ls -R

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Build Release APK
        run: gradle clean assembleRelease -x lintVitalRelease --no-daemon

      - name: Sign APKs
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/aerovpn-release.keystore" \
            -alias aerovpn -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass aerovpn123 -keypass aerovpn123 \
            -dname "CN=AeroVPN, OU=Release, O=AeroVPN, L=Argentina, ST=Buenos Aires, C=AR"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            signed="${apk%-unsigned.apk}.apk"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/aerovpn-release.keystore" \
              --ks-pass pass:aerovpn123 --key-pass pass:aerovpn123 \
              --out "$signed" "$apk"
          done

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks-signed
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
